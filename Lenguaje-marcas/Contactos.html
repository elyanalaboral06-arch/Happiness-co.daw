    <h1 class="text-3xl font-Asenine mb-4 text-[#555555]">Contacto</h1>
    <h1></h1>
    <p class="font-Asenine text-[#555555]">¿Tienes alguna pregunta? ¡Estamos aquí para ayudarte!</p>
    <h1></h1>
    <section class="max-w-3xl mx-auto p-6">

    <form class="bg-[#555555] p-6 rounded shadow space-y-4 font-Asenine text-[#ba007c]">

        <!-- NOMBRE -->
        <div>
            <label class="block text-sm ">Nombre</label>
            <input type="text" class="w-full border p-2 rounded">
        </div>

        <!-- APELLIDOS -->
        <div>
            <label class="block text-sm ">Apellidos</label>
            <input type="text" class="w-full border p-2 rounded">
        </div>

        <!-- EMAIL -->
        <div>
            <label class="block text-sm ">Email</label>
            <input type="email" class="w-full border p-2 rounded">
        </div>

        <!-- TELÉFONO -->
        <div>
            <label class="block text-sm ">Teléfono</label>
            <input type="tel" class="w-full border p-2 rounded">
        </div>

        <!-- COMENTARIO -->
        <div>
            <label class="block text-sm ">Comentario</label>
            <textarea class="w-full border p-2 rounded"></textarea>
        </div>

        <!-- CHECKBOX -->
        <div class="flex items-center gap-2">
            <input type="checkbox">
            <label>Acepto recibir información y suscribirme</label>
        </div>

        <!-- BOTÓN -->
        <button class="bg-[#ba007c] text-[#555555] px-4 py-2 rounded hover:bg-pink-800">
            Enviar
        </button>

    </form>

</section>
